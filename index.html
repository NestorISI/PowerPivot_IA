  DATA = DATA.filter(function(m){ return MODULOS_OCULTOS.indexOf(m.id) === -1; });

  var FLAT = [];
  DATA.forEach(function(m, mi){
    m.num = mi + 1;
    m.hojas.forEach(function(h, hi){
      h.num = hi + 1;
      h.moduloId = m.id;
      h.moduloTitle = m.title;
      h.code = "M" + m.num + "." + "H" + h.num;
      h.key = m.id + "-" + h.id;

    });
  });
  var TOTAL = FLAT.length;

  var STORAGE_KEY = "ppia-progreso";
  var THEME_KEY = "ppia-theme";

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress();

  function isDone(key){ return !!progress[key]; }
  function setDone(key, val){
    if(val){ progress[key] = true; } else { delete progress[key]; }
    saveProgress(progress);
    renderToc();
    renderProgressBar();
  }

  function countDone(){
    var n = 0;
    FLAT.forEach(function(h){ if(isDone(h.key)) n++; });
    return n;
  }

  function renderProgressBar(){
    var n = countDone();
    document.getElementById("progress-count").textContent = n + "/" + TOTAL;
    document.getElementById("progress-fill").style.width = (TOTAL ? (n / TOTAL * 100) : 0) + "%";
  }

  var toc = document.getElementById("toc");
  function renderToc(){
    var currentKey = getCurrentKey();
    toc.innerHTML = "";
    DATA.forEach(function(m){
      var item = document.createElement("div");
      item.className = "modulo-item";
      var hasActive = m.hojas.some(function(h){ return (m.id + "-" + h.id) === currentKey; });
      if(hasActive) item.classList.add("open");

      var btn = document.createElement("button");
      btn.className = "modulo-btn";
      btn.innerHTML = '<span class="modulo-num">' + m.num + '</span><span class="modulo-title">' + m.title + '</span><span class="modulo-caret">&#9656;</span>';
      btn.addEventListener("click", function(){ item.classList.toggle("open"); });
      item.appendChild(btn);

      var ul = document.createElement("ul");
      ul.className = "hoja-list";
      m.hojas.forEach(function(h){
        var li = document.createElement("li");
        var a = document.createElement("a");
        var key = m.id + "-" + h.id;
        a.href = "#" + key;
        a.textContent = "";
        var dot = document.createElement("span");
        dot.className = "check-dot" + (isDone(key) ? " done" : "");
        dot.innerHTML = isDone(key) ? "&#10003;" : "";
        a.appendChild(dot);
        var span = document.createElement("span");
        span.textContent = h.title;
        a.appendChild(span);
        if(key === currentKey) a.classList.add("active");
        li.appendChild(a);
        ul.appendChild(li);
      });
      item.appendChild(ul);
      toc.appendChild(item);
    });
  }

    var hash = window.location.hash.replace("#", "");
    return hash;

    for(var i=0;i<FLAT.length;i++){ if(FLAT[i].key === key) return FLAT[i]; }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function richText(s){
    var out = esc(s);
    var allowed = ["b","strong","i","em","u","code"];
    allowed.forEach(function(tag){
      out = out
        .replace(new RegExp("&lt;" + tag + "&gt;", "gi"), "<" + tag + ">")
        .replace(new RegExp("&lt;/" + tag + "&gt;", "gi"), "</" + tag + ">");
    });
    out = out.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
    var colors = { verde: "hl-green", ambar: "hl-amber", rojo: "hl-red" };
    Object.keys(colors).forEach(function(tag){
      out = out
        .replace(new RegExp("&lt;" + tag + "&gt;", "gi"), '<span class="' + colors[tag] + '">')
        .replace(new RegExp("&lt;/" + tag + "&gt;", "gi"), "</span>");
    });
    return out;
  }

  function renderHoja(h){

    var prompts = Array.isArray(h.prompt) ? h.prompt : [{ label: null, text: h.prompt }];
    var promptItems = prompts.filter(function(p){ return p.type !== "instructivo" && p.type !== "tip"; });
    var multi = promptItems.length > 1;
    var promptCounter = 0;
    document.getElementById("hoja-prompts").innerHTML = prompts.map(function(p, i){
      if (p.type === "tip") {
        var tipBody = (Array.isArray(p.text) ? p.text : [p.text]).map(function(t){ return "<p>" + richText(t) + "</p>"; }).join("");
        return '<details class="callout tip" style="' + (i > 0 ? "margin-top:14px;" : "") + '">' +
          '<summary class="block-label"><span class="dot"></span>' + esc(p.label || "Tip") + '<span class="toggle-hint">clic para mostrar</span></summary>' +
          tipBody +
          '</details>';
      }
      if (p.type === "instructivo") {
        return '<div class="callout instructivo" style="' + (i > 0 ? "margin-top:14px;" : "") + '">' +
          '<p class="block-label"><span class="dot"></span>' + esc(p.label || "Paso a seguir") + '</p>' +
          '<p class="instructivo-text">' + esc(p.text) + '</p>' +
          '</div>';
      }
      promptCounter++;
      var labelText = multi
        ? "Prompt " + promptCounter + " de " + promptItems.length + (p.label ? " · " + esc(p.label.replace(/^Paso \d+ · /, "")) : "")
        : "Prompt para la IA";
      return '<div class="callout ia" style="' + (i > 0 ? "margin-top:14px;" : "") + '">' +
        '<p class="block-label"><span class="dot"></span>' + labelText + '</p>' +
        '<p class="prompt-text">' + esc(p.text) + '</p>' +
        '<button class="copy-btn" data-prompt-idx="' + i + '">Copiar prompt</button>' +
        '</div>';
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll('#hoja-prompts .copy-btn'), function(copyBtn){
      copyBtn.onclick = function(){
        var text = prompts[Number(copyBtn.getAttribute("data-prompt-idx"))].text;
        function done_(){
          copyBtn.textContent = "Copiado";
          copyBtn.classList.add("copied");
          setTimeout(function(){ copyBtn.textContent = "Copiar prompt"; copyBtn.classList.remove("copied"); }, 1600);
        }
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(done_).catch(function(){ fallbackCopy(text); done_(); });
        } else {
          fallbackCopy(text); done_();
        }
      };
    });

    var ejEl = document.getElementById("hoja-ejercicio");

      return '<li><input type="checkbox" id="' + cid + '" data-idx="' + idx + '"' + (done ? " checked" : "") + '/><label for="' + cid + '">' + richText(item) + '</label></li>';
    }).join("");

    var markBtn = document.getElementById("btn-mark-done");
    var markHint = document.getElementById("mark-hint");
    function refreshMarkBtn(){
      var d = isDone(h.key);

      markBtn.classList.toggle("is-done", d);
      markHint.textContent = d ? "Tu progreso se guarda en este navegador." : "";
    }
    refreshMarkBtn();
    markBtn.onclick = function(){ setDone(h.key, !isDone(h.key)); refreshMarkBtn(); renderHoja(h); };

    function fallbackCopy(text){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
    }

    var idx = FLAT.indexOf(h);

    var pagerHtml = "";
    if(prev){
      pagerHtml += '<a class="prev" href="#' + prev.key + '"><span class="pager-kicker">&larr; ' + prev.code + '</span><span class="pager-title">' + esc(prev.title) + '</span></a>';
    } else {
      pagerHtml += '<span></span>';
    }
    if(next){
      pagerHtml += '<a class="next" href="#' + next.key + '"><span class="pager-kicker">' + next.code + ' &rarr;</span><span class="pager-title">' + esc(next.title) + '</span></a>';
    }
    document.getElementById("pager").innerHTML = pagerHtml;
  }

  function router(){
    var key = getCurrentKey();
    var h = key ? findHoja(key) : null;
    if(h){
      viewPortada.classList.remove("active");
      viewHoja.classList.add("active");
      renderHoja(h);
    } else {
      viewHoja.classList.remove("active");
      viewPortada.classList.add("active");
      renderPortada();
    }
    renderToc();
    renderProgressBar();
    window.scrollTo(0,0);
  }

  window.addEventListener("hashchange", router);

  document.getElementById("reset-progress").addEventListener("click", function(){
    progress = {};
    saveProgress(progress);
    router();
  });

  /* theme */
  function applyTheme(choice){
    if(choice === "light"){ document.documentElement.setAttribute("data-theme","light"); }
    else if(choice === "dark"){ document.documentElement.setAttribute("data-theme","dark"); }
    else { document.documentElement.removeAttribute("data-theme"); }
    ["light","dark","system"].forEach(function(c){
      document.getElementById("btn-" + c).classList.toggle("active", c === choice);
    });
    try{ localStorage.setItem(THEME_KEY, choice); }catch(e){}
  }
  ["light","dark","system"].forEach(function(c){
    document.getElementById("btn-" + c).addEventListener("click", function(){ applyTheme(c); });
  });
  var savedTheme = "system";
  try{ savedTheme = localStorage.getItem(THEME_KEY) || "system"; }catch(e){}
  applyTheme(savedTheme);

  router();
})();
</script>
